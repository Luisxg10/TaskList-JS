name: Validación de TaskList JS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pruebas:
    name: Pruebas automáticas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar pruebas
        run: npm test
